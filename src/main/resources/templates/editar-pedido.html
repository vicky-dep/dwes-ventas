<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-4">
        <div class="col"><h1 class="h2 mb-0">Editar pedido</h1></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver</a></div>
    </div>
    <form th:action="@{/pedidos/editar/{id}(id=${pedido.id})}" th:object="${pedido}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="id" class="form-label">Id</label>
            <input id="id" class="form-control" th:field="*{id}" readonly>
        </div>
        <div class="col-md-6">
            <label for="total" class="form-label">Total</label>
            <input id="total" class="form-control" type="number" min="0" step="0.01" th:field="*{total}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('total')}" th:errors="*{total}"></div>
        </div>
        <div class="col-md-6">
            <label for="fecha" class="form-label">Fecha</label>
                 <input id="fecha" class="form-control" type="date" name="fecha"
                     th:value="${pedido.fecha != null ? pedido.fecha.toString() : ''}">
            <div class="text-danger" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
        </div>
        <div class="col-md-6">
            <label for="clienteId" class="form-label">Cliente</label>
            <select id="clienteId" class="form-select" th:field="*{clienteId}" required>
                <option value="0" disabled>Selecciona un cliente</option>
                <option th:each="cliente : ${listaClientes}" th:value="${cliente.id}"
                        th:text="${cliente.nombre + ' ' + cliente.apellido1 + (cliente.apellido2 != null ? ' ' + cliente.apellido2 : '')}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
        </div>
        <div class="col-md-6">
            <label for="comercialId" class="form-label">Comercial</label>
            <select id="comercialId" class="form-select" th:field="*{comercialId}" required>
                <option value="0" disabled>Selecciona un comercial</option>
                <option th:each="comercial : ${listaComerciales}" th:value="${comercial.id}"
                        th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('comercialId')}" th:errors="*{comercialId}"></div>
        </div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
            <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
