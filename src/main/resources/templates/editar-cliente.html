<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-4">
        <div class="col"><h1 class="h2 mb-0">Editar cliente</h1></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a></div>
    </div>
    <form th:action="@{/clientes/editar/{id}(id=${cliente.id})}" th:object="${cliente}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="id" class="form-label">Id</label>
            <input id="id" class="form-control" th:field="*{id}" readonly>
        </div>
        <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="apellido1" class="form-label">Primer apellido</label>
            <input id="apellido1" class="form-control" th:field="*{apellido1}" required maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="apellido2" class="form-label">Segundo apellido</label>
            <input id="apellido2" class="form-control" th:field="*{apellido2}" maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="ciudad" class="form-label">Ciudad</label>
            <input id="ciudad" class="form-control" th:field="*{ciudad}" maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="categoria" class="form-label">Categoría</label>
            <input id="categoria" class="form-control" type="number" min="0" th:field="*{categoría}">
        </div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar cambios</button>
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>

    <section class="mt-5">
        <h2 class="h4 mb-3">Añadir comercial al cliente</h2>
        <form th:action="@{/clientes/editar/{id}/comerciales(id=${cliente.id})}" method="post" class="row g-3">
            <div class="col-md-6">
                <label for="comercialId" class="form-label">Comercial</label>
                <select id="comercialId" name="comercialId" class="form-select" required
                        th:disabled="${#lists.isEmpty(comercialesDisponibles)}">
                    <option value="" selected disabled>Selecciona un comercial</option>
                    <option th:each="comercial : ${comercialesDisponibles}" th:value="${comercial.id}"
                            th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="fecha" class="form-label">Fecha</label>
                <input id="fecha" name="fecha" class="form-control" type="date"
                       th:value="${fechaActual}" required>
            </div>
            <div class="col-md-3">
                <label for="prioridad" class="form-label">Prioridad</label>
                <input id="prioridad" name="prioridad" class="form-control" type="number" min="1"
                       value="1" required>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit" th:disabled="${#lists.isEmpty(comercialesDisponibles)}">
                    Añadir comercial
                </button>
            </div>
        </form>

        <h3 class="h5 mt-4 mb-3">Comerciales vinculados</h3>
        <div th:if="${#lists.isEmpty(comercialesVinculados)}" class="text-muted">No hay comerciales vinculados a este cliente.</div>
        <div class="table-responsive" th:unless="${#lists.isEmpty(comercialesVinculados)}">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th scope="col">Comercial</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Prioridad</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="vinculo : ${comercialesVinculados}">
                        <td th:text="${vinculo.comercialNombre + ' ' + vinculo.comercialApellido1 + (vinculo.comercialApellido2 != null ? ' ' + vinculo.comercialApellido2 : '')}"></td>
                        <td th:text="${vinculo.fecha}"></td>
                        <td th:text="${vinculo.prioridad}"></td>
                        <td>
                            <form th:action="@{/clientes/editar/{id}/comerciales/{comercialId}/borrar(id=${cliente.id}, comercialId=${vinculo.comercialId})}"
                                  method="post" class="m-0">
                                <button class="btn btn-outline-danger btn-sm" type="submit">Borrar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
