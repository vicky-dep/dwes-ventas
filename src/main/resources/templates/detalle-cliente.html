<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-4">
        <div class="col"><h1 class="h2 mb-0">Detalle de cliente</h1></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/clientes}">Volver</a></div>
    </div>
    <dl class="row">
        <dt class="col-sm-3">Id</dt><dd class="col-sm-9" th:text="${cliente.id}">0</dd>
        <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9" th:text="${cliente.nombre}">Nombre</dd>
        <dt class="col-sm-3">Primer apellido</dt><dd class="col-sm-9" th:text="${cliente.apellido1}">Apellido</dd>
        <dt class="col-sm-3">Segundo apellido</dt><dd class="col-sm-9" th:text="${cliente.apellido2}">Apellido</dd>
        <dt class="col-sm-3">Ciudad</dt><dd class="col-sm-9" th:text="${cliente.ciudad}">Ciudad</dd>
        <dt class="col-sm-3">Categoría</dt><dd class="col-sm-9" th:text="${cliente.categoría}">0</dd>
    </dl>
    <a class="btn btn-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
</main>
</body>
</html>
