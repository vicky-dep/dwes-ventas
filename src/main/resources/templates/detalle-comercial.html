<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-4">
        <div class="col"><h1 class="h2 mb-0">Detalle de comercial</h1></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/comerciales}">Volver</a></div>
    </div>
    <dl class="row">
        <dt class="col-sm-3">Id</dt><dd class="col-sm-9" th:text="${comercial.id}">0</dd>
        <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9" th:text="${comercial.nombre}">Nombre</dd>
        <dt class="col-sm-3">Primer apellido</dt><dd class="col-sm-9" th:text="${comercial.apellido1}">Apellido</dd>
        <dt class="col-sm-3">Segundo apellido</dt><dd class="col-sm-9" th:text="${comercial.apellido2}">Apellido</dd>
        <dt class="col-sm-3">Comisión</dt><dd class="col-sm-9" th:text="${comercial.comisión}">0.0</dd>
    </dl>
    <section class="mt-4">
        <h2 class="h4 mb-3">Pedidos</h2>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Total</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Cliente</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="4">Este comercial no tiene pedidos.</td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td th:text="${pedido.id}">0</td>
                        <td th:text="${pedido.total}">0.00</td>
                        <td th:text="${pedido.fecha ?: '-'}">fecha</td>
                        <td th:text="${pedido.clienteNombreCompleto}">cliente</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
    <a class="btn btn-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
</main>
</body>
</html>
