<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-3">
        <div class="col"><h1 class="h2 mb-0">Pedidos</h1></div>
        <div class="col-auto"><a class="btn btn-primary" th:href="@{/pedidos/crear}">Crear pedido</a></div>
    </div>
    <div class="row g-2 fw-bold border-bottom pb-2 d-none d-lg-flex">
        <div class="col-lg-1">Id</div>
        <div class="col-lg-2">Total</div>
        <div class="col-lg-2">Fecha</div>
        <div class="col-lg-3">Cliente</div>
        <div class="col-lg-2">Comercial</div>
        <div class="col-lg-2">Acciones</div>
    </div>
    <div class="row g-2 align-items-center border-bottom py-3" th:each="pedido : ${listaPedidos}">
        <div class="col-6 col-md-2 col-lg-1"><span class="d-lg-none fw-bold">Id: </span><span th:text="${pedido.id}">0</span></div>
        <div class="col-6 col-md-3 col-lg-2"><span class="d-lg-none fw-bold">Total: </span><span th:text="${pedido.total}">0</span></div>
        <div class="col-6 col-md-3 col-lg-2">
            <span class="d-lg-none fw-bold">Fecha: </span>
            <span th:text="${pedido.fecha != null ? pedido.fecha.toString() : ''}">2024-01-01</span>
        </div>
        <div class="col-6 col-md-4 col-lg-3"><span class="d-lg-none fw-bold">Cliente: </span><span th:text="${pedido.clienteNombreCompleto}">Nombre del cliente</span></div>
        <div class="col-6 col-md-4 col-lg-2"><span class="d-lg-none fw-bold">Comercial: </span><span th:text="${pedido.comercialNombreCompleto}">Nombre del comercial</span></div>
        <div class="col-12 col-lg-2 d-flex flex-wrap gap-1">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${pedido.id})}">Detalle</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
            <form th:action="@{/pedidos/borrar/{id}(id=${pedido.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
