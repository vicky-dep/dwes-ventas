<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comerciales</title>
    <style>
        .clearfix::after {
            content: "";
            display: block;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="contenedora" style="float: none; margin:0 auto; width: 95%">
        <div class="clearfix">
            <div style="float: left; width: 50%;">
                <h1>Comerciales</h1>
            </div>
        </div>
        <div class="clearfix">
            <div style="float: left; width: 20%">Id</div>
            <div style="float: left; width: 20%">Nombre</div>
            <div style="float: left; width: 20%">Apellido1</div>
            <div style="float: left; width: 20%">Apellido2</div>
            <div style="float: none; width: auto; overflow: hidden;">Comisión</div>
        </div>
        <div class="clearfix">
            <hr/>
        </div>
        <div th:each="comercial : ${listaComerciales}" style="margin-top: 6px;" class="clearfix">
            <div style="float: left; width: 20%" th:text="${comercial.id}">0</div>
            <div style="float: left; width: 20%" th:text="${comercial.nombre}">nombre</div>
            <div style="float: left; width: 20%" th:text="${comercial.apellido1}">apellido1</div>
            <div style="float: left; width: 20%" th:text="${comercial.apellido2 ?: '&nbsp;'}">apellido2</div>
            <div style="float: none; width: auto; overflow: hidden;" th:text="${comercial.comisión}">0.0</div>
        </div>
    </div>
</body>
</html>
