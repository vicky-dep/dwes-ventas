<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-4">
        <div class="col"><h1 class="h2 mb-0">Crear comercial</h1></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/comerciales}">Volver</a></div>
    </div>
    <form th:action="@{/comerciales/crear}" th:object="${comercial}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label>
            <input id="nombre" class="form-control" th:field="*{nombre}" required maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="apellido1" class="form-label">Primer apellido</label>
            <input id="apellido1" class="form-control" th:field="*{apellido1}" required maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="apellido2" class="form-label">Segundo apellido</label>
            <input id="apellido2" class="form-control" th:field="*{apellido2}" maxlength="100">
        </div>
        <div class="col-md-6">
            <label for="comision" class="form-label">Comisión</label>
            <input id="comision" class="form-control" type="number" step="any" min="0" max="1" th:field="*{comisión}">
        </div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/comerciales}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
