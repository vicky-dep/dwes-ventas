<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-4">
        <div class="col"><h1 class="h2 mb-0">Detalle de pedido</h1></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/pedidos}">Volver</a></div>
    </div>
    <dl class="row">
        <dt class="col-sm-3">Id</dt><dd class="col-sm-9" th:text="${pedido.id}">0</dd>
        <dt class="col-sm-3">Total</dt><dd class="col-sm-9" th:text="${pedido.total}">0</dd>
        <dt class="col-sm-3">Fecha</dt><dd class="col-sm-9" th:text="${pedido.fecha != null ? pedido.fecha.toString() : ''}">2024-01-01</dd>
        <dt class="col-sm-3">Cliente</dt><dd class="col-sm-9" th:text="${pedido.clienteNombreCompleto}">Nombre del cliente</dd>
        <dt class="col-sm-3">Comercial</dt><dd class="col-sm-9" th:text="${pedido.comercialNombreCompleto}">Nombre del comercial</dd>
    </dl>
    <a class="btn btn-primary" th:href="@{/pedidos/editar/{id}(id=${pedido.id})}">Editar</a>
</main>
</body>
</html>
