<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>
<main class="container py-4">
    <div class="row align-items-center border-bottom pb-3 mb-3">
        <div class="col"><h1 class="h2 mb-0">Clientes</h1></div>
        <div class="col-auto"><a class="btn btn-primary" th:href="@{/clientes/crear}">Crear cliente</a></div>
    </div>
    <form class="row g-2 align-items-end mb-4" th:action="@{/clientes}" method="get">
        <div class="col-sm-6 col-md-4">
            <label for="ciudad" class="form-label">Buscar por ciudad</label>
            <input id="ciudad" name="ciudad" type="text" class="form-control"
                   placeholder="Escribe una ciudad" th:value="${ciudad}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Buscar</button>
        </div>
        <div class="col-auto">
            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Limpiar</a>
        </div>
    </form>
    <div class="row g-2 fw-bold border-bottom pb-2 d-none d-lg-flex">
        <div class="col-lg-1">Id</div>
        <div class="col-lg-2">Nombre</div>
        <div class="col-lg-2">Apellido 1</div>
        <div class="col-lg-2">Apellido 2</div>
        <div class="col-lg-2">Ciudad</div>
        <div class="col-lg-1">Categoría</div>
        <div class="col-lg-2">Acciones</div>
    </div>
    <div class="row g-2 align-items-center border-bottom py-3" th:each="cliente : ${listaClientes}">
        <div class="col-6 col-md-2 col-lg-1"><span class="d-lg-none fw-bold">Id: </span><span th:text="${cliente.id}">0</span></div>
        <div class="col-6 col-md-5 col-lg-2"><span class="d-lg-none fw-bold">Nombre: </span><span th:text="${cliente.nombre}">Nombre</span></div>
        <div class="col-6 col-md-5 col-lg-2"><span class="d-lg-none fw-bold">Apellido 1: </span><span th:text="${cliente.apellido1}">Apellido</span></div>
        <div class="col-6 col-md-5 col-lg-2"><span class="d-lg-none fw-bold">Apellido 2: </span><span th:text="${cliente.apellido2}">Apellido</span></div>
        <div class="col-6 col-md-5 col-lg-2"><span class="d-lg-none fw-bold">Ciudad: </span><span th:text="${cliente.ciudad}">Ciudad</span></div>
        <div class="col-6 col-md-2 col-lg-1"><span class="d-lg-none fw-bold">Categoría: </span><span th:text="${cliente.categoría}">0</span></div>
        <div class="col-12 col-lg-2 d-flex flex-wrap gap-1">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/clientes/{id}(id=${cliente.id})}">Detalle</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
            <form th:action="@{/clientes/borrar/{id}(id=${cliente.id})}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
